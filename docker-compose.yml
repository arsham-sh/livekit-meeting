services:
  livekit:
    image: livekit/livekit-server:latest
    # Local Windows uses 127.0.0.1. Production must set LIVEKIT_NODE_IP
    # to the server's publicly reachable IP address.
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1} --udp-port 7882
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecr}"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
