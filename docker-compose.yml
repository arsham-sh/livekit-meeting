services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    # LiveKit WebRTC needs direct access to the host's RTC ports.
    # Host networking avoids Docker bridge/NAT candidates that the browser cannot reach.
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecr}"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
