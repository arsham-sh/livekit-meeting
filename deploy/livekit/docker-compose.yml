services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        turn:
          enabled: true
          udp_port: 3478
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
