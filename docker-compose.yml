services:
  livekit:
    image: livekit/livekit-server:latest
    # Docker Desktop on Windows does not expose Linux host networking as the
    # Windows host network. Publish the LiveKit ports instead and advertise
    # the Windows loopback address for this local-only MVP.
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1 --udp-port 7882
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecretdevsecretdevsecretdevsecr}"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
